# Dependabot keeps the pinned GitHub Actions and Python dev tools up to date.
# Once a week it opens a pull request when a newer version is released
# (for actions, with the new commit SHA already filled in).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "pip"
    directory: "/"   # requirements-dev.txt
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
