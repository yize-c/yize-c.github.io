name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Once a day, so ticks and solutions pushed to yize-c/interview-prep show up
  # on the Learner Space without a change here. (A push-triggered sync would
  # need a write token stored in the other repo; a daily run needs none.)
  schedule:
    - cron: "17 8 * * *"

# Least privilege: read-only by default; only the deploy job gets the two
# extra permissions GitHub Pages needs.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (see site-checks.yml for why).

# Only one deployment at a time; don't cancel one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # publish to GitHub Pages
      id-token: write   # prove to Pages that this run is allowed to deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # don't leave the token in .git/config
      - name: Build the public site folder (_site/)
        run: bash scripts/build_site.sh
      # My progress and solutions come from my interview-prep repo (public, so no token).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yize-c/interview-prep
          path: interview-prep
          persist-credentials: false
      - name: Sync "My progress" and solutions from interview-prep
        run: |
          python3 scripts/sync_interview_prep.py \
            --source interview-prep \
            --out _site/data \
            --updated "$(git -C interview-prep log -1 --format=%cs)"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # "Deployed" is not the same as "working": check the live site answers
      # and serves the real home page. Retries give the CDN a moment to update.
      - name: Smoke test the live site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "$PAGE_URL" | grep -q "<title>Yize Chen</title>"; then
              echo "Live site OK: $PAGE_URL"; exit 0
            fi
            echo "Not ready yet (try $i), waiting..."; sleep 15
          done
          echo "The live site did not serve the home page" >&2; exit 1
