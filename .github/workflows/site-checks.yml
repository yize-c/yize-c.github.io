name: Site checks

on:
  # Pushes to main are checked directly; other branches are checked once,
  # through their pull request, instead of twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly run, so a link that breaks on another site is noticed even when
  # nothing here changed.
  schedule:
    - cron: "23 6 * * 1"

# If a newer commit arrives on the same branch or PR, cancel the older run.
concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: these jobs only read the code.
permissions:
  contents: read

# Every action is pinned to a full commit SHA (a tag like v4 can be moved;
# a SHA cannot). Dependabot (.github/dependabot.yml) opens a PR when a newer
# version is out, so the pins don't go stale.

jobs:
  validate:
    name: HTML, partials and vendored files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the jobs only read the code
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate HTML
        run: npx --yes html-validate@11.16.2 "*.html" "projects/*.html"
      - name: Check CSS (duplicate selectors, syntax errors, typos)
        run: npx --yes stylelint@17.16.0 "css/*.css"
      - name: The public site folder builds and contains nothing private
        run: bash scripts/build_site.sh
      - name: Nav and footer match partials/
        run: python3 scripts/sync_partials.py --check
      - name: Vendored sql.js matches its recorded checksums
        working-directory: vendor/sql.js
        run: sha256sum --check --strict SHA256SUMS
      - name: Check that every JSON data file parses
        run: |
          for f in $(find data -name '*.json'); do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f" || { echo "Invalid JSON: $f"; exit 1; }
          done

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the jobs only read the code
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Run the demo and data tests
        run: node --test
      - name: Run the Python tests (the two sync scripts)
        run: python3 -m unittest discover -s tests -p "test_*.py"
      # Catch a mismatch between interview-prep's README and the site's data early,
      # instead of at deploy time.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yize-c/interview-prep
          path: interview-prep
          persist-credentials: false
      - name: interview-prep syncs cleanly
        run: python3 scripts/sync_interview_prep.py --source interview-prep --out "$RUNNER_TEMP/sync"

  python:
    name: Python lint and security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the jobs only read the code
          fetch-depth: 0               # gitleaks scans the whole history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the pinned tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and format (ruff, settings in pyproject.toml)
        run: |
          ruff check .
          ruff format --check .
      - name: Security lint (bandit)
        run: bandit -q -r .
      - name: Known vulnerabilities in the pinned tools (pip-audit)
        run: pip-audit -r requirements-dev.txt
      # The release binary, checked against the checksum gitleaks publishes,
      # instead of a third-party action.
      - name: Secrets in the code and its history (gitleaks)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source "$GITHUB_WORKSPACE" --no-banner --redact

  links:
    name: Link checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the jobs only read the code
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --root-dir resolves root-absolute links like /css/tokens.css (used by 404.html).
          args: --config lychee.toml --no-progress --root-dir "${{ github.workspace }}" './**/*.html'
          fail: true
